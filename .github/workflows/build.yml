name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: Fedora, layer shell ${{ matrix.layer_shell }}
    runs-on: ubuntu-latest
    container: fedora:latest
    strategy:
      fail-fast: false
      matrix:
        layer_shell: ["ON", "OFF"]
    steps:
      - name: Install dependencies
        run: >
          dnf install -y git cmake ninja-build gcc-c++
          qt6-qtbase-devel qt6-qttools-devel layer-shell-qt-devel
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Ninja -DWITH_LAYER_SHELL=${{ matrix.layer_shell }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  rpm:
    name: Fedora ${{ matrix.fedora }} RPM
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        # A package only installs on the Fedora version it was built on.
        fedora: [44, 45]
    steps:
      - name: Install dependencies
        run: >
          dnf install -y git rpm-build cmake ninja-build gcc-c++
          qt6-qtbase-devel qt6-qttools-devel layer-shell-qt-devel
          desktop-file-utils appstream
      - uses: actions/checkout@v4
      - name: Build the packages
        run: |
          git config --global --add safe.directory "$PWD"
          packaging/build-rpm.sh rpms
      - uses: actions/upload-artifact@v4
        with:
          name: rpms-fedora-${{ matrix.fedora }}
          path: rpms/*.rpm
          if-no-files-found: error

  # Pushing a tag v<version> publishes a release with the packages attached.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rpms-*
          merge-multiple: true
          path: rpms
      - name: Check that the tag matches the version
        run: |
          version=${GITHUB_REF_NAME#v}
          grep -q "^    VERSION $version\$" CMakeLists.txt
          grep -q "^Version: *$version\$" packaging/shuangpin-overlay.spec
          grep -q "^## $version " CHANGELOG.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '/^## /{on = ($2 == v); next} on' CHANGELOG.md > notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
              gh release edit "$GITHUB_REF_NAME" --title "$version" --notes-file notes.md
              gh release upload "$GITHUB_REF_NAME" rpms/*.x86_64.rpm --clobber
          else
              gh release create "$GITHUB_REF_NAME" rpms/*.x86_64.rpm --title "$version" --notes-file notes.md
          fi
